# Local MinIO — an S3-compatible server for testing the packetizer upload path
# before touching real AWS. Brings up the API (:9000) and web console (:9001).
#
#   docker compose -f docker-compose.minio.yml up -d
#   # console: http://localhost:9001  (login minioadmin / minioadmin)
#   # then create the bucket + run the packetizer (see PLATFORM_BRIDGE.md, Step 1)
#   docker compose -f docker-compose.minio.yml down        # stop
#   docker compose -f docker-compose.minio.yml down -v     # stop + wipe data
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API  -> use as --endpoint-url http://localhost:9000
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  minio_data:
